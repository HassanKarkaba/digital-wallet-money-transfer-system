{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="panel account-panel">
  <h1>{{ title }}</h1>
  <p>{{ text }}</p>
  <form method="post">{% csrf_token %}<button class="button primary" type="submit">{{ button }}</button></form>
  <p><a href="{% url 'accounts:login' %}">Return to sign in</a></p>
</section>
{% endblock %}
