[tool.ruff]
target-version = "py313"
line-length = 110
extend-exclude = ["*/migrations/*", "licenses", "staticfiles"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
"scripts/browser_checks.py" = ["E402"]
"scripts/workload_check.py" = ["E402"]
